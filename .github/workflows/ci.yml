name: LCB / reproducible quality gates
on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    name: Python 3.12 / tests and real CLI round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q bench tests
      - name: Regression suite
        run: python -m pytest -q
      - name: CLI actual end-to-end contract
        run: |
          lcb run --characters 1 --environments 1 --materials 1 --seed 42 --output "$RUNNER_TEMP/lcb.json"
          lcb report "$RUNNER_TEMP/lcb.json" --format html
          lcb report "$RUNNER_TEMP/lcb.json" --format csv
          lcb report "$RUNNER_TEMP/lcb.json" --format md
          lcb compare "$RUNNER_TEMP/lcb.json" "$RUNNER_TEMP/lcb.json"
          test -s "$RUNNER_TEMP/lcb.json"
          test -s "$RUNNER_TEMP/lcb.png"
          test -s "$RUNNER_TEMP/lcb.html"
          test -s "$RUNNER_TEMP/lcb.csv"
          test -s "$RUNNER_TEMP/lcb.md"
